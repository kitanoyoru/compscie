name: CI

# Single definition of the web app checks. Pull requests run it directly; the
# Learning platform workflow calls it on main and deploys only if it passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check generated repository data is fresh
        run: |
          yarn generate:data
          git diff --exit-code -- src/data/generated/repository.ts

      # `yarn check` is Yarn's built-in integrity check; `run check` is the tsc script.
      - name: Type-check
        run: yarn run check

      - name: Run tests
        run: yarn test --run

      - name: Build production site
        run: yarn build

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: production-site
          path: web/dist
          if-no-files-found: error
          retention-days: 14

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/yarn.lock') }}

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      # In CI the Playwright web server only previews the dist built above.
      - name: Run browser smoke tests
        run: yarn e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
