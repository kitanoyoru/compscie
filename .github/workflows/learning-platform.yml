name: Deploy learning platform

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: learning-platform-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - run: yarn --cwd web install --frozen-lockfile
      - run: yarn --cwd web generate:data
      - run: git diff --exit-code -- web/src/data/generated/repository.ts
      - run: yarn --cwd web run check
      - run: yarn --cwd web test --run
      - run: yarn --cwd web build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
